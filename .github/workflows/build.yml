name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Unzip project
        run: unzip -o mod.zip -d project
      - name: Build
        run: cd project && gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ArrowPath-1.21.11
          path: |
            project/build/libs/*.jar
            !project/build/libs/*-sources.jar
